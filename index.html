<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第3営業部_振返りシート</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Sans','Meiryo','Segoe UI',sans-serif;background:#f0f4f8;color:#1e293b;font-size:14px;min-height:100vh}
/* Header */
.hdr{background:#0f172a;color:#fff;padding:9px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hdr-title{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.hdr-title svg{opacity:.7}
.hdr-actions{display:flex;gap:8px;align-items:center}
.btn{padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.22)}
.badge-saved{background:#10b981;color:#fff;font-size:11px;padding:3px 9px;border-radius:100px;display:none}
/* Group tabs */
.group-nav{background:#1e3a5f;padding:0 20px;display:flex;gap:0}
.group-btn{padding:8px 22px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:700;color:rgba(255,255,255,.6);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.15s;letter-spacing:.05em}
.group-btn:hover{color:#fff}
.group-btn.active{color:#fff;border-bottom-color:#60a5fa}
/* Tabs */
.tab-nav{background:#fff;border-bottom:2px solid #e2e8f0;padding:0 20px;display:flex;gap:0;overflow-x:auto}
.tab-btn{padding:9px 18px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:#64748b;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s}
.tab-btn:hover{color:#1e293b}
.tab-btn.active{color:#3b82f6;border-bottom-color:#3b82f6}
/* Layout */
.main{padding:14px 18px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* Viewport-fit month layout */
.month-wrap{display:flex;flex-direction:column;height:calc(100vh - 119px);padding:8px 14px;max-width:1400px;margin:0 auto;gap:8px;overflow:hidden}
/* Sections below KPI — normal scroll */
.month-lower{padding:0 14px 24px;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
/* Cards */
.card{background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card-title{font-size:13px;font-weight:900;color:#1e3a5f;display:flex;align-items:center;gap:0;margin:-10px -14px 10px;padding:8px 14px;background:linear-gradient(90deg,#dbeafe 0%,#eff6ff 100%);border-radius:10px 10px 0 0;justify-content:flex-start;letter-spacing:.03em;border-bottom:2px solid #bfdbfe}
.card-title::before{content:'';display:inline-block;width:4px;height:16px;background:#2563eb;border-radius:2px;flex-shrink:0;margin-right:8px}
/* 売上構造モニタリング tbl-wrap (scrollなし・枠あり) */
.rev-tbl-wrap{overflow:hidden;border-radius:6px;border:1px solid #e2e8f0}
.kpi-table tr.cat-row td{background:#eff6ff!important}
/* KPI card: fills viewport remaining space */
.kpi-card{display:flex;flex-direction:column;flex:1;min-height:0}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0;overflow:hidden}
.kpi-grid .tbl-wrap{overflow:hidden;border-radius:6px;border:1px solid #e2e8f0}
.kpi-card table{table-layout:fixed;width:100%}
/* KPI table */
.kpi-table{font-size:var(--kpi-fs,11px);width:100%;border-collapse:collapse;table-layout:auto}
.kpi-table th{background:#f1f5f9;font-weight:700;color:#475569;padding:4px 7px;text-align:left;border-bottom:2px solid #e2e8f0;white-space:nowrap;font-size:calc(var(--kpi-fs,11px) - 1px)}
.kpi-table td{height:var(--kpi-row-h,20px);padding:0 4px;border-bottom:1px solid #f1f5f9;vertical-align:middle;overflow:hidden}
.kpi-table tr:last-child td{border-bottom:none}
.kpi-table tr:hover td{background:#f8fafc}
/* 数値セル（目標・実績） */
.kpi-table .editable{padding:0 4px;font-size:var(--kpi-num-fs,10px);height:100%;line-height:1.2;color:#475569}
.kpi-table .rbadge{padding:1px 4px;font-size:calc(var(--kpi-fs,11px) - 1px)}
.kpi-table .hl-dot{width:8px;height:8px}
/* カテゴリセル: 背景色＋太字で区切りを明確に */
.kpi-table .cat-cell{font-size:calc(var(--kpi-fs,11px) - 1px);font-weight:800;color:#2563eb;letter-spacing:.02em;padding:0 5px}
.kpi-table td:has(.cat-cell){background:#eff6ff!important}
.kpi-table .del-row{font-size:12px}
/* KPI項目名: 太字＋やや大きめで視認性UP */
.kpi-item{border:1px solid transparent;border-radius:4px;padding:1px 4px;font-size:var(--kpi-fs,11px);font-weight:700;color:#0f172a;line-height:1.3;min-height:16px;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-family:inherit;background:transparent;transition:.15s;outline:none;min-width:60px}
.kpi-item:hover{border-color:#cbd5e1;background:#f8fafc;white-space:normal}
.kpi-item:focus{border-color:#3b82f6;background:#fff;box-shadow:0 0 0 3px rgba(59,130,246,.15);white-space:normal}
/* サブ項目: 字下げ＋色を少し薄く */
.kpi-item.sub{padding-left:16px;font-weight:500;color:#475569}
/* 要因セル: 1行省略表示 */
.kpi-reason-cell{overflow:hidden}
.kpi-reason-cell .editable{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* グローバルツールチップ (body直下、overflow制約なし) */
#kpi-tip{position:fixed;background:#1e293b;color:#f8fafc;padding:8px 13px;border-radius:8px;
  white-space:pre-wrap;word-break:break-word;min-width:200px;max-width:420px;
  z-index:9999;font-size:12px;line-height:1.65;box-shadow:0 4px 20px rgba(0,0,0,.3);
  pointer-events:none;display:none;border:1px solid rgba(255,255,255,.1)}
/* 要因フォーカス時の展開テキストエリア */
#kpi-reason-expand{position:fixed;background:#fff;border:2px solid #3b82f6;border-radius:8px;
  padding:8px 10px;min-width:280px;max-width:460px;min-height:80px;max-height:220px;
  z-index:9998;font-size:13px;line-height:1.65;font-family:inherit;color:#1e293b;
  resize:both;box-shadow:0 4px 24px rgba(0,0,0,.15),0 0 0 4px rgba(59,130,246,.15);
  display:none;outline:none;white-space:pre-wrap;word-break:break-word}
/* KGI */
.kgi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
@media(max-width:700px){.kgi-grid{grid-template-columns:repeat(2,1fr)}}
.kgi-cell{text-align:center;padding:12px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.kgi-label{font-size:11px;color:#64748b;font-weight:600;margin-bottom:6px;letter-spacing:.03em}
.kgi-val{font-size:20px;font-weight:800}
.c-green{color:#059669}.c-amber{color:#d97706}.c-red{color:#dc2626}.c-blue{color:#2563eb}.c-gray{color:#94a3b8}
.c-pos{color:#059669}.c-neg{color:#dc2626}
/* Progress bar */
.pbar-wrap{background:#e2e8f0;border-radius:100px;height:8px;overflow:hidden;margin:6px 0}
.pbar{height:100%;border-radius:100px;transition:width .6s}
.pbar.green{background:#10b981}.pbar.amber{background:#f59e0b}.pbar.red{background:#ef4444}
/* Inline edit */
.editable{border:1px solid transparent;border-radius:5px;padding:3px 7px;background:transparent;font-size:inherit;color:inherit;font-weight:inherit;font-family:inherit;width:100%;transition:.15s;text-align:inherit}
.editable:hover{border-color:#cbd5e1;background:#f8fafc}
.editable:focus{border-color:#3b82f6;background:#fff;outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.editable-num{text-align:right}
textarea.editable{resize:vertical;min-height:60px;line-height:1.6}
/* Table */
.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f1f5f9;font-weight:700;color:#475569;padding:7px 10px;text-align:left;border-bottom:2px solid #e2e8f0;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:4px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
.cat-cell{font-size:10px;font-weight:700;color:#3b82f6;white-space:nowrap;background:#eff6ff!important;padding:2px 10px}
/* Rate badge */
.rbadge{display:inline-block;padding:2px 9px;border-radius:100px;font-size:12px;font-weight:700}
.rb-green{background:#d1fae5;color:#065f46}.rb-amber{background:#fef3c7;color:#92400e}
.rb-red{background:#fee2e2;color:#991b1b}.rb-na{background:#f1f5f9;color:#94a3b8}
/* HL dot */
.hl-dot{width:10px;height:10px;border-radius:50%;background:#e2e8f0;cursor:pointer;transition:.2s;display:inline-block}
.hl-dot.on{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
/* Toggle */
.toggle-label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:#475569}
.toggle-track{width:38px;height:21px;background:#cbd5e1;border-radius:100px;position:relative;transition:.2s;flex-shrink:0}
.toggle-track.on{background:#3b82f6}
.toggle-thumb{width:17px;height:17px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-track.on .toggle-thumb{left:19px}
/* Competitive bars */
.comp-bars{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.cbar-item{}
.cbar-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.cbar-type{font-weight:700;font-size:13px}
.cbar-info{font-size:12px;color:#64748b}
.cbar-track{background:#f1f5f9;border-radius:7px;height:26px;overflow:visible;position:relative}
.cbar-fill{height:100%;border-radius:7px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:#fff;transition:width .6s;min-width:30px;position:relative;z-index:1}
.cbar-target{position:absolute;top:-4px;bottom:-4px;width:2px;z-index:2;border-radius:2px}
/* Theme boxes */
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.theme-grid{grid-template-columns:1fr}}
.theme-box{background:#f8fafc;border-radius:10px;padding:16px;border:1px solid #e2e8f0}
.theme-box-label{font-size:11px;font-weight:700;color:#64748b;margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase}
.theme-sub{font-size:11px;font-weight:700;color:#94a3b8;margin-top:10px;margin-bottom:4px}
/* Q全体 */
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:700px){.ov-grid{grid-template-columns:1fr}}
.ov-card{background:#f8fafc;border-radius:10px;padding:16px;text-align:center;border:1px solid #e2e8f0}
.ov-month{font-size:12px;font-weight:700;color:#64748b;margin-bottom:8px}
.ov-rate{font-size:32px;font-weight:900}
.ov-sub{font-size:12px;color:#94a3b8;margin-top:4px}
.chart-wrap{height:240px;position:relative}
/* Select */
.sel{border:1px solid transparent;border-radius:5px;padding:3px 6px;font-size:12px;background:transparent;cursor:pointer;font-family:inherit;color:inherit}
.sel:hover{border-color:#cbd5e1;background:#f8fafc}
.sel:focus{border-color:#3b82f6;outline:none}
/* Add row */
.add-row{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px dashed #cbd5e1;border-radius:7px;background:#f8fafc;color:#64748b;cursor:pointer;font-size:12px;font-weight:600;margin-top:10px;width:fit-content;transition:.15s}
.add-row:hover{border-color:#3b82f6;color:#3b82f6;background:#eff6ff}
/* Row delete */
.del-row{opacity:0;background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:0 4px;line-height:1;transition:.15s}
tr:hover .del-row{opacity:1}
.subrow td:first-child .editable{padding-left:20px}
/* Divider label */
.sec-divider{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:12px;font-weight:600;margin:4px 0}
.sec-divider::before,.sec-divider::after{content:'';flex:1;height:1px;background:#e2e8f0}
/* Fcst check */
.fcst-check{width:16px;height:16px;accent-color:#3b82f6;cursor:pointer}
/* Probability select */
.prob-badge{padding:2px 8px;border-radius:5px;font-size:12px;font-weight:700}
.prob-p4{background:#d1fae5;color:#065f46}.prob-p3{background:#dbeafe;color:#1e40af}
.prob-p2{background:#fef3c7;color:#92400e}.prob-p1{background:#fee2e2;color:#991b1b}.prob-na{background:#f1f5f9;color:#94a3b8}
/* ── ロジックツリー ───────────────────────────── */
.rev-tree-scroll{overflow-x:auto;padding-bottom:8px}
.rev-tree-section{margin-bottom:14px}
.rev-tree-section-title{font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:3px;padding:2px 8px;display:inline-block;margin-bottom:8px}
.rtc{border-radius:6px;background:#fff;border:1.5px solid #e2e8f0;width:116px;flex-shrink:0;font-size:10px}
.rtc-head{padding:3px 7px;font-weight:700;font-size:9.5px;border-radius:4px 4px 0 0;border-bottom:1px solid #e2e8f0;line-height:1.3}
.rtc-body{display:flex;align-items:stretch}
.rtc-vals{flex:1;padding:2px 6px;display:flex;flex-direction:column;gap:1px}
.rtc-vrow{display:flex;justify-content:space-between;align-items:center;font-size:9.5px}
.rtc-lbl{color:#94a3b8;font-size:8.5px}
.rtc-num{font-weight:600;color:#1e293b}
.rtc-badge{display:flex;align-items:center;justify-content:center;width:44px;font-size:9.5px;font-weight:700;color:#fff;border-radius:0 4px 4px 0;flex-shrink:0}
.rtb-red{background:#ef4444}.rtb-blue{background:#2563eb}.rtb-gray{background:#94a3b8}
.rt-hconn{height:2px;background:#cbd5e1;flex-shrink:0;align-self:center}
.rt-fork{display:flex;flex-direction:column;justify-content:center;width:18px;flex-shrink:0}
.rt-fork-t{border-bottom:2px solid #cbd5e1;border-left:2px solid #cbd5e1;border-radius:0 0 0 4px}
.rt-fork-b{border-top:2px solid #cbd5e1;border-left:2px solid #cbd5e1;border-radius:4px 0 0 0}
.rt-col{display:flex;flex-direction:column}
.rt-row{display:flex;align-items:stretch;gap:0}
.rt-divider{height:1px;background:#e2e8f0;margin:12px 0}
.rt-vdivider{width:1px;background:#e2e8f0;margin:0 20px;align-self:stretch}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-title">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/></svg>
    第3営業部_振返りシート
  </div>
  <div class="hdr-actions">
    <span id="syncStatus" style="font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:4px">
      <span id="syncDot" style="width:7px;height:7px;border-radius:50%;background:#94a3b8;display:inline-block"></span>
      <span id="syncLabel">読込中…</span>
    </span>
    <span class="badge-saved" id="savedBadge">✓ 保存済み</span>
    <button class="btn btn-ghost" onclick="openHistoryModal()" title="変更履歴">🕐 履歴</button>
    <button class="btn btn-ghost" id="exportBtn" onclick="exportGroup()">📤 エクスポート</button>
    <label class="btn btn-ghost" id="importBtn" style="cursor:pointer">📥 インポート<input type="file" accept=".json" style="display:none" onchange="importGroup(this)"></label>
    <button class="btn btn-ghost" onclick="refreshFromStorage()">🔄 最新取得</button>
    <button class="btn btn-blue" onclick="saveData()">💾 保存</button>
  </div>
</div>

<div class="group-nav" id="groupNav">
  <button class="group-btn active" onclick="switchGroup('MB1G',this)">MB1G</button>
  <button class="group-btn" onclick="switchGroup('MB2G',this)">MB2G</button>
  <button class="group-btn" onclick="switchGroup('MB3G',this)">MB3G</button>
  <button class="group-btn" onclick="switchGroup('ALL',this)" style="margin-left:16px;border-left:1px solid rgba(255,255,255,.2);padding-left:22px">第3営業部ALL</button>
</div>
<div class="tab-nav" id="tabNav">
  <button class="tab-btn active" onclick="switchTab('初月',this)">初月</button>
  <button class="tab-btn" onclick="switchTab('中月',this)">中月</button>
  <button class="tab-btn" onclick="switchTab('末月',this)">末月</button>
  <button class="tab-btn" onclick="switchTab('Q全体',this)">📊 Q全体サマリー</button>
  <button class="tab-btn" onclick="switchTab('説明書',this)" style="margin-left:auto;color:#7c3aed">📖 説明書</button>
</div>

<div id="root"></div>

<!-- 貼り付け画像ビューア（ドラッグ可能なフローティングパネル） -->
<!-- 貼り付け画像パネル -->
<div id="imgPanel" style="display:none;position:fixed;bottom:24px;right:24px;z-index:9000;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.25);border:1px solid #e2e8f0;width:440px;max-width:90vw;overflow:hidden;user-select:none">
  <div id="imgPanelBar" style="display:flex;align-items:center;justify-content:space-between;background:#0f172a;padding:6px 12px;cursor:grab">
    <span style="color:#fff;font-size:12px;font-weight:700">📸 貼り付け画像</span>
    <div style="display:flex;gap:6px">
      <button onclick="toggleImgZoom()" id="zoomBtn" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer">拡大</button>
      <button onclick="closeImgPanel()" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer">✕</button>
    </div>
  </div>
  <div style="overflow:auto;max-height:55vh">
    <img id="pastedImg" style="width:100%;display:block;cursor:zoom-in" onclick="toggleImgZoom()">
  </div>
  <div style="padding:8px 12px;border-top:1px solid #e2e8f0;display:flex;align-items:center;gap:8px">
    <button onclick="analyzeRevFromImg()" style="flex:1;padding:6px 0;background:#3b82f6;color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer">🔍 売上構造モニタリングに反映</button>
    <span id="imgAnalyzeStatus" style="font-size:11px;color:#64748b;min-width:60px;text-align:right"></span>
  </div>
</div>

<!-- KPI→売上構造マッピングモーダル -->
<div id="kpiRevModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:20px;max-width:620px;width:94%;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="font-size:14px;font-weight:800;color:#0f172a">KPI → 売上構造モニタリング 反映</h2>
      <button onclick="closeKpiRevModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8">×</button>
    </div>
    <p style="font-size:11px;color:#64748b">KPI表の数値を売上構造モニタリングの対応項目にコピーします。反映したい行にチェックを入れてください。</p>
    <div id="kpiRevBody"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;padding-top:4px;border-top:1px solid #e2e8f0">
      <button onclick="applyKpiToRev()" style="padding:7px 20px;background:#3b82f6;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer">✓ 反映する</button>
      <button onclick="closeKpiRevModal()" style="padding:7px 14px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:7px;font-size:13px;color:#475569;cursor:pointer">キャンセル</button>
    </div>
  </div>
</div>

// ── 同期ステータス ────────────────────────
function setSyncStatus(s){
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  if(!dot||!lbl) return;
  const m = {loading:['#f59e0b','読込中…'],ok:['#10b981','同期済み'],saving:['#3b82f6','保存中…'],error:['#ef4444','エラー'],offline:['#94a3b8','ローカル']};
  const [c,t] = m[s]||m.ok;
  dot.style.background=c; lbl.textContent=t;
}

// ── デフォルトstate生成 ───────────────────
function makeDefaultState(){
  const s={};
  GROUPS.forEach(g=>s[g]={初月:makeMonth(),中月:makeMonth(),末月:makeMonth()});
  return s;
}

// ── データ補完（新バージョン追加分を既存dataにマージ）──
function mergeDefaults(loaded){
  const isNew = GROUPS.some(g=>loaded[g]);
  let grouped;
  if(!isNew){
    grouped={};
    GROUPS.forEach(g=>{
      grouped[g]=g==='MB1G'
        ?{初月:loaded['初月']||makeMonth(),中月:loaded['中月']||makeMonth(),末月:loaded['末月']||makeMonth()}
        :{初月:makeMonth(),中月:makeMonth(),末月:makeMonth()};
    });
  } else {
    grouped=loaded;
    GROUPS.forEach(g=>{ if(!grouped[g]) grouped[g]={初月:makeMonth(),中月:makeMonth(),末月:makeMonth()}; });
  }
  const dkpi=DEFAULT_KPI();
  GROUPS.forEach(g=>MONTHS.forEach(m=>{
    if(!grouped[g][m]) return;
    const ex=grouped[g][m].kpi||[];
    const ids=new Set(ex.map(k=>k.id));
    dkpi.forEach(d=>{ if(!ids.has(d.id)) ex.push({...d}); });
    ex.sort((a,b)=>a.id-b.id);
    grouped[g][m].kpi=ex;
    if(!grouped[g][m].rev) grouped[g][m].rev=DEFAULT_REVENUE().map(r=>({...r,tgt:null,act:null}));
    else{
      const dr=DEFAULT_REVENUE(), er=new Set(grouped[g][m].rev.map(r=>r.id));
      dr.forEach(d=>{ if(!er.has(d.id)) grouped[g][m].rev.push({...d,tgt:null,act:null}); });
      grouped[g][m].rev.sort((a,b)=>a.id-b.id);
    }
  }));
  return grouped;
}

// ── GAS API ──────────────────────────────
async function gasPost(body){
  const res = await fetch(GAS_URL, {
    method : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body   : JSON.stringify(body),
  });
  if(!res.ok) throw new Error(res.status);
  return res.json();
}

// ── 起動時ロード ──────────────────────────
let _lastKnownJson = null;
let _historyList   = [];
let _pollTimer     = null;

async function initLoad(){
  // 名前チェック
  const saved = localStorage.getItem(USER_KEY);
  if(saved){ _currentUser=saved; const el=document.getElementById('currentUserLabel'); if(el) el.textContent='👤 '+saved; }
  else showNameModal();

  // GASからロード
  if(GAS_URL === ''){
    setSyncStatus('offline');
    render(); return;
  }
  setSyncStatus('loading');
  try{
    const rec = await gasPost({action:'load'});
    if(rec && rec.state){
      _lastKnownJson = JSON.stringify(rec.state);
      state = mergeDefaults(rec.state);
      _historyList = rec.history || [];
    }
    setSyncStatus('ok');
  } catch(e){
    try{ const l=localStorage.getItem('振返りシート'); if(l) state=mergeDefaults(JSON.parse(l)); }catch(e2){}
    setSyncStatus('offline');
  }
  render();
  startPolling();
}

// ── 保存 ──────────────────────────────────
async function saveData(){
  setSyncStatus('saving');
  const stateJson = JSON.stringify(state);
  // ローカルにも保存（オフライン時バックアップ）
  try{ localStorage.setItem('振返りシート', stateJson); }catch(e){}
  // GAS保存
  if(GAS_URL !== ''){
    try{
      await gasPost({action:'save', state, savedBy:getCurrentUser(), group:activeGroup, month:activeTab});
      _lastKnownJson = stateJson;
      setSyncStatus('ok');
    } catch(e){ setSyncStatus('offline'); }
  }
  const b=document.getElementById('savedBadge');
  b.style.display='inline';
  setTimeout(()=>b.style.display='none',2000);
}

// ── ポーリング（15秒ごと）────────────────
async function pollStorage(){
  if(GAS_URL==='') return;
  const lbl=document.getElementById('syncLabel');
  if(lbl&&lbl.textContent==='保存中…') return;
  if(document.getElementById('historyModal')?.style.display==='flex') return;
  try{
    const rec = await gasPost({action:'load'});
    if(!rec||!rec.state) return;
    const j = JSON.stringify(rec.state);
    if(j===_lastKnownJson) return;
    _lastKnownJson=j;
    state=mergeDefaults(rec.state);
    _historyList=rec.history||[];
    render(); setSyncStatus('ok');
    const l2=document.getElementById('syncLabel');
    if(l2){ l2.textContent='他の人の変更を反映'; setTimeout(()=>{ if(l2) l2.textContent='同期済み'; },2500); }
  }catch(e){}
}

function startPolling(){
  if(_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(pollStorage,15000);
}

async function refreshFromStorage(){
  setSyncStatus('loading');
  try{
    const rec=await gasPost({action:'load'});
    if(rec&&rec.state){
      _lastKnownJson=JSON.stringify(rec.state);
      state=mergeDefaults(rec.state);
      _historyList=rec.history||[];
      render();
    }
    setSyncStatus('ok');
    const b=document.getElementById('savedBadge');
    b.textContent='↓ 最新取得済み'; b.style.display='inline';
    setTimeout(()=>{ b.style.display='none'; b.textContent='✓ 保存済み'; },2000);
  }catch(e){ setSyncStatus('error'); alert('取得失敗: '+e.message); }
}

    if(rec&&rec.history){ _historyList=rec.history; renderHistoryList(); }

function closeHistoryModal(){ document.getElementById('historyModal').style.display='none'; }

function renderHistoryList(){
  const list=document.getElementById('historyList');
  if(!_historyList.length){ list.innerHTML='<div style="color:#94a3b8;font-size:12px;padding:8px">履歴がありません。</div>'; return; }
  const palette=['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#ec4899','#84cc16'];
  const uc={};let ci=0;
  const gc=n=>{ if(!uc[n]) uc[n]=palette[ci++%palette.length]; return uc[n]; };
  list.innerHTML=_historyList.map((e,i)=>{
    const d=new Date(e.savedAt);
    const dl=isNaN(d)?e.savedAt:d.getFullYear()+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2)+'  '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    const col=gc(e.savedBy||'匿名');
    const newest=i===0?'<span style="background:#dbeafe;color:#1e40af;font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;margin-left:4px">最新</span>':'';
    const gb=e.group?`<span style="background:#f1f5f9;color:#475569;font-size:10px;padding:1px 6px;border-radius:4px">${e.group}</span>`:'';
    const mb=e.month?`<span style="background:#f1f5f9;color:#475569;font-size:10px;padding:1px 6px;border-radius:4px">${e.month}</span>`:'';
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc">
      <span style="width:6px;height:6px;border-radius:50%;background:${col};flex-shrink:0"></span>
      <span style="font-weight:700;color:${col};min-width:60px;font-size:12px">${e.savedBy||'匿名'}</span>
      <span style="color:#64748b;font-size:11px;flex:1">${dl}${newest}</span>
      <span style="display:flex;gap:4px">${gb}${mb}</span>
      <button onclick="rollbackTo(${i})" style="padding:3px 12px;background:#fff;color:#475569;border:1px solid #cbd5e1;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer"
        onmouseover="this.style.background='#3b82f6';this.style.color='#fff'" onmouseout="this.style.background='#fff';this.style.color='#475569'">↩ RB</button>
    </div>`;
  }).join('');
}

async function rollbackTo(idx){
  const e=(_historyList||[])[idx];
  if(!e){ alert('履歴が見つかりません'); return; }
  if(!confirm(`「${e.savedBy||'匿名'}」の保存時点に戻しますか？`)) return;
  setSyncStatus('saving');
  try{
    const res=await gasPost({action:'rollback',index:idx,savedBy:getCurrentUser()});
    if(res.state){ state=mergeDefaults(res.state); _lastKnownJson=JSON.stringify(res.state); }
    const rec=await gasPost({action:'load'});
    if(rec&&rec.history) _historyList=rec.history;
    closeHistoryModal(); render(); setSyncStatus('ok');
  }catch(e){ setSyncStatus('error'); alert('ロールバック失敗: '+e.message); }
}

function exportGroup(){
  if(activeGroup==='ALL'){ alert('第3営業部ALLはエクスポートできません。各グループタブに切り替えてください。'); return; }
  const today = new Date();
  const ymd = today.getFullYear() + ('0'+(today.getMonth()+1)).slice(-2) + ('0'+today.getDate()).slice(-2);
  const payload = { group: activeGroup, exportedAt: today.toISOString(), data: state[activeGroup] };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = activeGroup + '_振返りシート_' + ymd + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importGroup(input){
  const file = input.files[0];
  if(!file) return;
  input.value = '';
  const reader = new FileReader();
  reader.onload = e => {
    let payload;
    try { payload = JSON.parse(e.target.result); } catch(err) { alert('JSONの読み込みに失敗しました。ファイルを確認してください。'); return; }
    const group = payload.group;
    if(!group || !GROUPS.includes(group)){ alert('グループ情報が不正なファイルです（group: ' + group + '）'); return; }
    if(!payload.data){ alert('データが含まれていないファイルです。'); return; }
    if(!confirm(group + ' のデータをインポートします。現在の ' + group + ' のデータは上書きされます。よろしいですか？')) return;
    state[group] = payload.data;
    saveData();
    // インポートしたグループに切り替える
    activeGroup = group;
    document.querySelectorAll('.group-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.trim() === group);
    });
    render();
    alert(group + ' のデータをインポートしました。');
  };
  reader.readAsText(file);
}

function resetData(){
  if(!confirm('全データをリセットしますか？')) return;
  state = makeDefaultState();
  saveData();
  render();
}

function resetSection(m, section){
  const names = {kgi:'KGI',kpi:'KPI',rev:'売上構造モニタリング',cases:'注力案件',comp:'競合勝率',theme:'テーマ・振返り'};
  if(!confirm(m + 'の「' + (names[section]||section) + '」をリセットしますか？')) return;
  if(section==='kgi')   state[activeGroup][m].kgi   = {tgt:null,act:null,reason:''};
  if(section==='kpi')   { state[activeGroup][m].kpi = DEFAULT_KPI(); state[activeGroup][m].showHlOnly = false; }
  if(section==='rev')   state[activeGroup][m].rev   = DEFAULT_REVENUE().map(r=>({...r,tgt:null,act:null}));
  if(section==='cases') state[activeGroup][m].cases = [{id:1,company:'',sales:'',prob:'',mrr:'',fcst:false,status:''},{id:2,company:'',sales:'',prob:'',mrr:'',fcst:false,status:''},{id:3,company:'',sales:'',prob:'',mrr:'',fcst:false,status:''},{id:4,company:'',sales:'',prob:'',mrr:'',fcst:false,status:''}];
  if(section==='comp')  state[activeGroup][m].comp  = DEFAULT_COMP().map(c=>({...c,comps:null,wins:null,reason:''}));
  if(section==='theme') { state[activeGroup][m].theme1={theme:'',retro:''}; state[activeGroup][m].theme2={theme:'',aim:''}; }
  saveData(); render();
}

function fmtCaseMrr(v){
  if(!v && v !== 0) return '';
  const n = parseFloat(String(v).replace(/[¥,]/g,''));
  return isNaN(n) || n === 0 ? '' : '¥' + n.toLocaleString();
}
function fmtYen(v){
  if(v===null||v===''||isNaN(v)) return '—';
  return '¥'+Number(v).toLocaleString();
}
function fmtNum(v){
  if(v===null||v===''||isNaN(v)) return '—';
  return Number(v).toLocaleString();
}
function parseNum(v){
  // ¥, カンマ, スペースを除去してパース
  return parseFloat(String(v??'').replace(/[¥,\s]/g,''));
}
function calcRate(tgt,act){
  const t=parseNum(tgt), a=parseNum(act);
  if(isNaN(t)||isNaN(a)||t===0) return null;
  return (a/t)*100;
}
function rateColor(r){
  if(r===null) return 'c-gray';
  if(r>=100) return 'c-green';
  if(r>=80) return 'c-amber';
  return 'c-red';
}
function rateBadgeClass(r){
  if(r===null) return 'rb-na';
  if(r>=100) return 'rb-green';
  if(r>=80) return 'rb-amber';
  return 'rb-red';
}
function rateBarClass(r){
  if(r===null) return 'green';
  if(r>=100) return 'green';
  if(r>=80) return 'amber';
  return 'red';
}
function probClass(p){
  if(p==='P4') return 'prob-p4';
  if(p==='P3') return 'prob-p3';
  if(p==='P2') return 'prob-p2';
  if(p==='P1') return 'prob-p1';
  return 'prob-na';
}

function switchGroup(name, btn){
  activeGroup = name;
  document.querySelectorAll('.group-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const isAll = name === 'ALL';
  const eb = document.getElementById('exportBtn');
  const ib = document.getElementById('importBtn');
  if(eb) { eb.disabled = isAll; eb.style.opacity = isAll ? '.4' : '1'; eb.style.cursor = isAll ? 'not-allowed' : 'pointer'; }
  if(ib) { ib.style.opacity = isAll ? '.4' : '1'; ib.style.pointerEvents = isAll ? 'none' : 'auto'; }
  render();
}

function switchTab(name,btn){
  activeTab = name;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  render();
}

function render(){
  // stateが未初期化の場合は何もしない
  if(!state || !state[activeGroup]) return;
  Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}});
  charts={};
  const root = document.getElementById('root');
  if(activeTab==='説明書'){
    root.innerHTML = renderManual();
  } else if(activeTab==='Q全体'){
    root.innerHTML = activeGroup==='ALL' ? renderOverviewAll() : renderOverview();
    afterRenderOverview();
  } else {
    root.innerHTML = activeGroup==='ALL' ? renderMonthAll(activeTab) : renderMonth(activeTab);
    if(activeGroup!=='ALL') requestAnimationFrame(fitKpi);
  }
}

// KPI行高を自動調整：2列すべての行が1画面に収まるよう計算
function fitKpi(){
  const card = document.querySelector('.kpi-card');
  if(!card) return;

  const cardH   = card.clientHeight;
  const titleEl = card.querySelector('.card-title');
  const titleH  = titleEl ? titleEl.offsetHeight + 6 : 28;
  const cardPad = 20; // padding 10px × 2

  // グリッドに割り当てられる高さ
  const gridH = Math.max(80, cardH - cardPad - titleH);

  // theadの実測高さ（両列共通）
  const theads = card.querySelectorAll('thead');
  const theadH = theads.length ? Math.max(...Array.from(theads).map(t=>t.offsetHeight)) : 26;

  // 2列中、行数が多い方を基準にする
  const tbodies = card.querySelectorAll('tbody');
  const maxRows = Math.max(...Array.from(tbodies).map(tb=>tb.querySelectorAll('tr').length));
  if(maxRows === 0) return;

  // 利用可能な行エリア = gridH - theadH - ボーダー(wrap:2px + 行間:maxRows-1px)
  const rowH  = Math.max(14, Math.floor((gridH - theadH - 2 - (maxRows - 1)) / maxRows));
  const fs    = Math.min(14, Math.max(10, Math.floor(rowH * 0.68)));   // KPI項目名フォント
  const numFs = Math.min(12, Math.max(9,  Math.floor(rowH * 0.55)));   // 数値フォント（少し小さめ）

  // tbl-wrapに明示的な高さを設定してoverflowを完全に封じる
  const tblWraps = card.querySelectorAll('.tbl-wrap');
  tblWraps.forEach(w => { w.style.height = gridH + 'px'; });

  const root = document.documentElement;
  root.style.setProperty('--kpi-row-h',  rowH  + 'px');
  root.style.setProperty('--kpi-fs',     fs    + 'px');
  root.style.setProperty('--kpi-num-fs', numFs + 'px');
}

function getMonthData(m){ return activeGroup==='ALL' ? getAggState(m) : state[activeGroup][m]; }

function getAggState(m){
  const first = state[GROUPS[0]][m];
  const tgtNums = GROUPS.map(g=>parseNum(state[g][m].kgi.tgt)).filter(n=>!isNaN(n)&&n!==0);
  const actNums = GROUPS.map(g=>parseNum(state[g][m].kgi.act)).filter(n=>!isNaN(n)&&n!==0);
  const kgi = {
    tgt: tgtNums.length ? tgtNums.reduce((a,b)=>a+b,0) : null,
    act: actNums.length ? actNums.reduce((a,b)=>a+b,0) : null,
    reason: ''
  };
  const kpi = first.kpi.map(k=>{
    const tgts = GROUPS.map(g=>{const x=state[g][m].kpi.find(i=>i.id===k.id); return (x&&x.tgt!==null&&x.tgt!=='') ? parseNum(x.tgt) : NaN;}).filter(n=>!isNaN(n));
    const acts = GROUPS.map(g=>{const x=state[g][m].kpi.find(i=>i.id===k.id); return (x&&x.act!==null&&x.act!=='') ? parseNum(x.act) : NaN;}).filter(n=>!isNaN(n));
    return {...k, tgt:tgts.length?tgts.reduce((a,b)=>a+b,0):null, act:acts.length?acts.reduce((a,b)=>a+b,0):null, reason:''};
  });
  const rev = first.rev.map(r=>{
    const tgts = GROUPS.map(g=>{const x=state[g][m].rev.find(i=>i.id===r.id); return (x&&x.tgt!==null) ? parseNum(x.tgt) : NaN;}).filter(n=>!isNaN(n));
    const acts = GROUPS.map(g=>{const x=state[g][m].rev.find(i=>i.id===r.id); return (x&&x.act!==null) ? parseNum(x.act) : NaN;}).filter(n=>!isNaN(n));
    const isRate  = r.item.includes('率');
    const isPrice = r.item.includes('単価');
    const calc = arr => {
      if(!arr.length) return null;
      const sum = arr.reduce((a,b)=>a+b,0);
      if(isRate)  return Math.round(sum/arr.length*10)/10;   // 平均・小数第1位
      if(isPrice) return Math.round(sum/arr.length);          // 平均・整数
      return sum;                                              // 合計
    };
    return {...r, tgt:calc(tgts), act:calc(acts)};
  });
  const cases = GROUPS.flatMap(g=>
    state[g][m].cases.filter(c=>c.company).map(c=>({...c,_group:g}))
  );
  const comp = first.comp.map(c=>{
    const compsSum = GROUPS.map(g=>{const x=state[g][m].comp.find(i=>i.type===c.type); return (x&&x.comps) ? Number(x.comps) : 0;}).reduce((a,b)=>a+b,0);
    const winsSum  = GROUPS.map(g=>{const x=state[g][m].comp.find(i=>i.type===c.type); return (x&&x.wins)  ? Number(x.wins)  : 0;}).reduce((a,b)=>a+b,0);
    return {...c, comps:compsSum||null, wins:winsSum||null, reason:''};
  });
  return {kgi, kpi, rev, cases, comp, showHlOnly:false, theme1:{theme:'',retro:''}, theme2:{theme:'',aim:''}};
}

// Q全体サマリーALL用：3グループ×3ヶ月のrev集計
// 翌Qアイテムは各グループで翌Qデータが入力されている最新月のみ使用
function getAllQRevAgg(){
  const MONTHS_DESC = ['末月','中月','初月']; // 新しい月優先
  // グループごとに翌Qデータが入力されている最新月を事前に特定
  const latestYokuQMonth = {};
  GROUPS.forEach(g=>{
    latestYokuQMonth[g] = MONTHS_DESC.find(m=>
      state[g][m].rev.some(i=>i.item.startsWith('翌Q')&&(i.tgt!==null||i.act!==null))
    ) || null;
  });
  const first = state[GROUPS[0]]['初月'].rev;
  return first.map(r=>{
    const isYokuQ = r.item.startsWith('翌Q');
    const tgts=[], acts=[];
    GROUPS.forEach(g=>{
      const months = isYokuQ ? (latestYokuQMonth[g] ? [latestYokuQMonth[g]] : []) : MONTHS;
      months.forEach(m=>{
        const x=state[g][m].rev.find(i=>i.id===r.id);
        if(x&&x.tgt!==null){const n=parseNum(x.tgt); if(!isNaN(n))tgts.push(n);}
        if(x&&x.act!==null){const n=parseNum(x.act); if(!isNaN(n))acts.push(n);}
      });
    });
    const isRate=r.item.includes('率'), isPrice=r.item.includes('単価');
    const calc=arr=>{if(!arr.length)return null; const s=arr.reduce((a,b)=>a+b,0); if(isRate)return Math.round(s/arr.length*10)/10; if(isPrice)return Math.round(s/arr.length); return s;};
    return {...r, tgt:calc(tgts), act:calc(acts)};
  });
}

// Q全体サマリー用：単一グループの3ヶ月分rev集計
function getQRevAgg(){
  const first = state[activeGroup]['初月'].rev;
  return first.map(r=>{
    const tgts = MONTHS.map(m=>{const x=state[activeGroup][m].rev.find(i=>i.id===r.id); return (x&&x.tgt!==null)?parseNum(x.tgt):NaN;}).filter(n=>!isNaN(n));
    const acts = MONTHS.map(m=>{const x=state[activeGroup][m].rev.find(i=>i.id===r.id); return (x&&x.act!==null)?parseNum(x.act):NaN;}).filter(n=>!isNaN(n));
    const isRate=r.item.includes('率'), isPrice=r.item.includes('単価');
    const calc=arr=>{if(!arr.length)return null; const s=arr.reduce((a,b)=>a+b,0); if(isRate)return Math.round(s/arr.length*10)/10; if(isPrice)return Math.round(s/arr.length); return s;};
    return {...r, tgt:calc(tgts), act:calc(acts)};
  });
}

function renderRevTree(m, revData){
  const rev = revData || state[activeGroup][m].rev;
  const g = id => rev.find(x=>x.id===id) || {tgt:null,act:null};

  function card(label, item, hs, sm){
    const rate = calcRate(item.tgt, item.act);
    const rs = rate!==null ? rate.toFixed(1)+'%' : '—';
    const bc = rate===null ? 'rtb-gray' : rate>=100 ? 'rtb-blue' : 'rtb-red';
    const isMoney = /金額|MRR|単価/.test(label);
    const fmtVal = v => { const n=parseNum(v); return isNaN(n) ? '—' : isMoney ? fmtYen(n) : fmtNum(n); };
    const t = (item.tgt!==null && item.tgt!=='') ? fmtVal(item.tgt) : '—';
    const a = (item.act!==null && item.act!=='') ? fmtVal(item.act) : '—';
    return `<div class="rtc"><div class="rtc-head" style="${hs};${sm?'font-size:8.5px':''}">${label}</div><div class="rtc-body"><div class="rtc-vals"><div class="rtc-vrow"><span class="rtc-lbl">目標</span><span class="rtc-num">${t}</span></div><div class="rtc-vrow"><span class="rtc-lbl">実績</span><span class="rtc-num">${a}</span></div></div><div class="rtc-badge ${bc}">${rs}</div></div></div>`;
  }

  // Connector: each child draws its own vertical bar segment meeting at gap midpoints
  function branch(parentCard, children, gap){
    gap = gap || 12;
    if(!children || children.length === 0) return parentCard;
    if(children.length === 1) return `<div style="display:flex;align-items:center;gap:0">${parentCard}<div style="width:14px;height:2px;background:#cbd5e1;flex-shrink:0"></div>${children[0]}</div>`;
    const n = children.length;
    const arms = children.map((child, i) => {
      const isFirst = i === 0;
      const isLast = i === n - 1;
      const topV = isFirst ? '50%' : `-${gap/2}px`;
      const botV = isLast ? '50%' : `-${gap/2}px`;
      return `<div style="position:relative;padding-left:14px"><div style="position:absolute;left:0;top:${topV};bottom:${botV};width:2px;background:#cbd5e1"></div><div style="position:absolute;left:0;top:50%;width:12px;height:2px;background:#cbd5e1;margin-top:-1px"></div>${child}</div>`;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:0">${parentCard}<div style="width:14px;height:2px;background:#cbd5e1;flex-shrink:0"></div><div style="display:flex;flex-direction:column;gap:${gap}px">${arms}</div></div>`;
  }

  function chain3(cA, cB, cC){ return branch(cA, [branch(cB, [cC])]); }

  // 合計受注金額（①+②の和）
  const r1=g(1),r2=g(2);
  const sumT = (parseNum(r1.tgt)||0)+(parseNum(r2.tgt)||0);
  const sumA = (parseNum(r1.act)||0)+(parseNum(r2.act)||0);
  const rTot = {tgt:sumT||null, act:sumA||null};

  // ── 当Q全体 ──
  const topTree = branch(
    card('受注金額',rTot,'background:#dbeafe;color:#1e40af'),
    [
      branch(
        card('受注社数',g(8),'background:#fef9c3;color:#713f12'),
        [
          card('P4件数（当Q予定日/確定日のみ）',g(15),'background:#ffedd5;color:#9a3412',true),
          card('P4受注率',g(16),'background:#ffedd5;color:#9a3412'),
        ]
      ),
      branch(
        card('受注単価',g(5),'background:#d1fae5;color:#065f46'),
        [card('P4単価',g(17),'background:#d1fae5;color:#065f46')]
      ),
    ]
  );

  // ── ① 先Q以前 ──
  const tree1 = branch(
    card('受注金額①',g(1),'background:#dbeafe;color:#1e40af'),
    [
      branch(
        card('受注件数①',g(6),'background:#fef9c3;color:#713f12'),
        [
          branch(
            card('P4件数①（当Q予定日/確定日のみ）',g(18),'background:#ffedd5;color:#9a3412',true),
            [
              card('当QP3件数①（Q初案件+前倒し案件）',g(9),'background:#ede9fe;color:#4c1d95',true),
              card('P3→P4率①',g(10),'background:#fce7f3;color:#9d174d'),
            ]
          ),
          card('P4受注率①',g(19),'background:#ffedd5;color:#9a3412'),
        ]
      ),
      chain3(
        card('受注単価①',g(3),'background:#d1fae5;color:#065f46'),
        card('P4単価①',g(20),'background:#d1fae5;color:#065f46'),
        card('P3単価①',g(11),'background:#d1fae5;color:#065f46')
      ),
    ]
  );

  // ── ② 当Q商談 ──
  const tree2 = branch(
    card('受注金額②',g(2),'background:#cffafe;color:#164e63'),
    [
      branch(
        card('受注件数②',g(7),'background:#fef08a;color:#713f12'),
        [
          branch(
            card('P4件数②（当Q予定日/確定日のみ）',g(21),'background:#fed7aa;color:#7c2d12',true),
            [
              card('P3件数②（当Q商談全て）',g(12),'background:#f3e8ff;color:#581c87',true),
              card('P3→P4率②',g(13),'background:#fce7f3;color:#831843'),
            ]
          ),
          card('P4受注率②',g(22),'background:#fed7aa;color:#7c2d12'),
        ]
      ),
      chain3(
        card('受注単価②',g(4),'background:#dcfce7;color:#14532d'),
        card('P4単価②',g(23),'background:#dcfce7;color:#14532d'),
        card('P3単価②',g(14),'background:#dcfce7;color:#14532d')
      ),
    ]
  );

  // ── 翌Q ──
  const treeNextQ = `
<div style="display:flex;align-items:flex-start;gap:0">
  <div>
    <div style="font-size:9px;font-weight:700;background:#ffedd5;color:#9a3412;border-radius:3px;padding:1px 7px;display:inline-block;margin-bottom:6px">P4経由（確度高）</div>
    <div>${branch(card('翌QP4金額',g(30),'background:#fed7aa;color:#7c2d12'),[card('翌QP4件数',g(27),'background:#fed7aa;color:#7c2d12'),card('翌QP4単価',g(28),'background:#d1fae5;color:#065f46')])}</div>
  </div>
  <div class="rt-vdivider"></div>
  <div>
    <div style="font-size:9px;font-weight:700;background:#ede9fe;color:#6d28d9;border-radius:3px;padding:1px 7px;display:inline-block;margin-bottom:6px">P3経由（育成中）</div>
    <div>${branch(card('翌QP3金額',g(26),'background:#ddd6fe;color:#4c1d95'),[card('翌QP3件数',g(24),'background:#ddd6fe;color:#4c1d95'),card('翌QP3単価',g(25),'background:#d1fae5;color:#065f46')])}</div>
  </div>
</div>`;

  return `
<div class="rev-tree-scroll">
  <div class="rev-tree-section">
    <div class="rev-tree-section-title" style="background:#dbeafe;color:#1d4ed8">当Q 受注構造（全体）</div>
    ${topTree}
  </div>
  <div class="rt-divider"></div>
  <div style="font-size:10px;font-weight:700;color:#475569;margin-bottom:8px">▼ パイプライン別内訳</div>
  <div style="display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap">
    <div>
      <div class="rev-tree-section-title" style="background:#dbeafe;color:#1d4ed8">① 先Q以前パイプライン</div>
      ${tree1}
    </div>
    <div>
      <div class="rev-tree-section-title" style="background:#cffafe;color:#164e63">② 当Q商談パイプライン</div>
      ${tree2}
    </div>
  </div>
  <div class="rt-divider"></div>
  <div class="rev-tree-section">
    <div class="rev-tree-section-title" style="background:#ede9fe;color:#6d28d9">翌Q パイプライン</div>
    ${treeNextQ}
  </div>
  <div style="margin-top:10px;display:flex;gap:12px;align-items:center">
    <span style="font-size:8.5px;color:#94a3b8">達成率：</span>
    <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:10px;height:10px;background:#ef4444;border-radius:2px;display:inline-block"></span><span style="font-size:8.5px;color:#64748b">未達</span></span>
    <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:10px;height:10px;background:#2563eb;border-radius:2px;display:inline-block"></span><span style="font-size:8.5px;color:#64748b">超過達成</span></span>
    <span style="display:inline-flex;align-items:center;gap:3px"><span style="width:10px;height:10px;background:#94a3b8;border-radius:2px;display:inline-block"></span><span style="font-size:8.5px;color:#64748b">目標なし</span></span>
  </div>
</div>`;
}

function renderCompBar(c){
  if(c.wins===null||c.comps===null||!c.comps) return `
<div class="cbar-item">
  <div class="cbar-head"><span class="cbar-type">${c.type}</span><span class="cbar-info">データなし</span></div>
  <div class="cbar-track"><div class="cbar-fill" style="width:0%;background:#e2e8f0"></div></div>
</div>`;
  const actual = Math.round((c.wins/c.comps)*100);
  const target = c.tgtRate||0;
  const pct = Math.min(actual,100);
  const tpct = Math.min(target,100);
  const color = actual>=target ? '#10b981' : actual>=target*0.8 ? '#f59e0b' : '#ef4444';
  return `
<div class="cbar-item">
  <div class="cbar-head">
    <span class="cbar-type">${c.type}</span>
    <span class="cbar-info">実績 ${actual}% / 目標 ${target}%</span>
  </div>
  <div class="cbar-track">
    <div class="cbar-fill" style="width:${pct}%;background:${color}">${actual}%</div>
    ${target?`<div class="cbar-target" style="left:${tpct}%;background:#1e293b" title="目標:${target}%"></div>`:''}
  </div>
</div>`;
}

          <thead><tr><th>種別</th>${MONTHS.map(m=>`<th style="text-align:center">${m}</th>`).join('')}</tr></thead>

  const allItems = state[activeGroup]['初月'].kpi.map(k=>k.item);
  return allItems.map(item=>{
    return `<tr>
      <td style="font-size:12px">${item}</td>
      ${MONTHS.map(m=>{
        const k = state[activeGroup][m].kpi.find(x=>x.item===item);
        if(!k) return '<td style="text-align:right">—</td><td style="text-align:center">—</td>';
        const r = calcRate(k.tgt, k.act);
        return `<td style="text-align:right">${k.act!==null&&k.act!==''?fmtNum(k.act):'—'}</td>
                <td style="text-align:center"><span class="rbadge ${rateBadgeClass(r)}">${r!==null?r.toFixed(1)+'%':'—'}</span></td>`;
      }).join('')}
    </tr>`;
  }).join('');
}

// data-exp 属性のある入力にフォーカスしたら展開TAを表示
document.addEventListener('focus', e => {
  const input = e.target;
  if (!input.hasAttribute('data-exp')) return;
  tipEl.style.display = 'none'; // tooltipを隠す
  expandTA.placeholder = input.placeholder || '入力…';

  _reasonInput = input;
  expandTA.value = input.value;

  // セル位置に合わせて表示位置を決定
  const rect = input.getBoundingClientRect();
  const taW = Math.max(280, Math.min(460, window.innerWidth - rect.left - 8));
  const taH = 100;
  let top = rect.bottom + 6;
  if (top + taH > window.innerHeight - 8) top = rect.top - taH - 6;
  let left = rect.left;
  if (left + taW > window.innerWidth - 8) left = window.innerWidth - taW - 8;

  expandTA.style.width  = taW + 'px';
  expandTA.style.top    = top + 'px';
  expandTA.style.left   = left + 'px';
  expandTA.style.display = 'block';

  // 次フレームでフォーカス & カーソルを末尾に
  requestAnimationFrame(() => {
    expandTA.focus();
    expandTA.setSelectionRange(expandTA.value.length, expandTA.value.length);
  });
}, true);

// TAの入力を元のinputに同期
expandTA.addEventListener('input', () => {
  if (_reasonInput) _reasonInput.value = expandTA.value;
});

document.addEventListener('paste', e => {
  const inp = e.target;
  const isKpi = inp.classList.contains('kpi-num-inp');
  const isRev = inp.classList.contains('rev-num-inp');
  if (!isKpi && !isRev) return;

  const text = (e.clipboardData || window.clipboardData).getData('text');
  const rows = text.split(/\r?\n/)
    .map(r => r.split('\t').map(v => v.trim()))
    .filter(r => r.some(v => v !== ''));

  if (!rows.length || rows.length <= 1 && rows[0] && rows[0].length <= 1) return;
  e.preventDefault();

  const m        = inp.dataset.m;
  const startIdx = parseInt(inp.dataset.idx);
  const field    = inp.dataset.field;
  const arr      = isKpi ? state[activeGroup][m].kpi : state[activeGroup][m].rev;

  rows.forEach((row, i) => {
    const pos = startIdx + i;
    if (pos >= arr.length) return;
    if (row.length >= 2) {
      if (row[0] !== '') arr[pos].tgt = row[0];
      if (row[1] !== '') arr[pos].act = row[1];
    } else {
      if (row[0] !== '') arr[pos][field] = row[0];
    }
  });

  render();
});

function getApiKey(){ return localStorage.getItem('claudeApiKey')||''; }

async function analyzeRevFromImg(){
  const img = document.getElementById('pastedImg');
  if(!img.src || img.src === window.location.href){
    alert('先に Ctrl+V でスクリーンショットを貼り付けてください。');
    return;
  }

  let key = getApiKey();
  if(!key){
    key = prompt('Anthropic API Key（sk-ant-...）を入力してください。\n※このブラウザにのみ保存されます。', '');
    if(!key) return;
    localStorage.setItem('claudeApiKey', key.trim());
    key = key.trim();
  }

  const statusEl = document.getElementById('imgAnalyzeStatus');
  statusEl.textContent = '解析中...';
  document.querySelector('#imgPanel button[onclick="analyzeRevFromImg()"]').disabled = true;

  try {
    const base64  = img.src.split(',')[1];
    const mtype   = img.src.split(';')[0].split(':')[1] || 'image/png';

    const fieldList = REV_FIELDS.map(f => `"${f.name}"`).join(', ');
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 2048,
        messages: [{role:'user', content:[
          {type:'image', source:{type:'base64', media_type:mtype, data:base64}},
          {type:'text', text:`この画像はBillOneの売上構造モニタリングシートです。
以下の各項目の目標値（tgt）と実績値（act）を抽出してください。

対象項目: ${fieldList}

ルール：
- 数値からカンマ・¥・%を除いた純粋な数値のみ返す（例: 1234567）
- 画像に存在しない/空欄の項目はnullにする
- %表記の項目は%を除いた数値で返す（例: 45.2）

以下のJSON形式のみで返答（説明不要）：
{"result":{"受注金額①":{"tgt":null,"act":null},"受注金額②":{"tgt":null,"act":null},...（全項目）}}`}
        ]}]
      })
    });

    if(!resp.ok){
      const e = await resp.json().catch(()=>({error:{message:resp.statusText}}));
      throw new Error(e.error?.message || resp.statusText);
    }

    const data = await resp.json();
    const text = data.content[0].text.trim();
    const jsonStr = text.match(/\{[\s\S]*\}/)?.[0];
    if(!jsonStr) throw new Error('JSONが返されませんでした');
    const parsed = JSON.parse(jsonStr);
    const result = parsed.result || parsed;

    // 抽出できた項目だけ収集
    const extracted = [];
    REV_FIELDS.forEach(f => {
      const v = result[f.name];
      if(!v) return;
      const tgt = v.tgt !== null && v.tgt !== undefined ? String(v.tgt) : null;
      const act = v.act !== null && v.act !== undefined ? String(v.act) : null;
      if(tgt !== null || act !== null) extracted.push({...f, tgt, act});
    });

    if(!extracted.length){ statusEl.textContent = '項目なし'; alert('数値を抽出できませんでした。'); return; }

    // 確認モーダル表示
    window._revExtracted = extracted;
    showRevConfirm(extracted);
    statusEl.textContent = `${extracted.length}件検出`;

  } catch(err){
    statusEl.textContent = 'エラー';
    alert('解析エラー: ' + err.message);
  } finally {
    document.querySelector('#imgPanel button[onclick="analyzeRevFromImg()"]').disabled = false;
  }
}

// 売上構造 単価・率 自動計算
// ─────────────────────────────────────────
function autoCalcRev(m){
  const rv = state[activeGroup][m].rev;
  const v  = (id, f) => parseNum(rv.find(x=>x.id===id)?.[f]);
  const setV = (id, f, val, isRate) => {
    if(!isFinite(val) || isNaN(val) || val <= 0) return;
    const item = rv.find(x=>x.id===id);
    if(!item) return;
    item[f] = isRate ? Math.round(val*10)/10 : Math.round(val);
  };

  ['tgt','act'].forEach(f=>{
    // 受注単価① = 受注金額① / 受注件数①
    setV(3,  f, v(1,f) / v(6,f));
    // 受注単価② = 受注金額② / 受注件数②
    setV(4,  f, v(2,f) / v(7,f));
    // 受注単価（合計）= (金額①+②) / (件数①+②)
    setV(5,  f, (v(1,f)+v(2,f)) / (v(6,f)+v(7,f)));

    // P3→P4率① = P4件数① / P3件数① × 100
    setV(10, f, v(18,f) / v(9,f) * 100, true);
    // P3単価① = 受注金額① / P3件数①
    setV(11, f, v(1,f)  / v(9,f));

    // P3→P4率② = P4件数② / P3件数② × 100
    setV(13, f, v(21,f) / v(12,f) * 100, true);
    // P3単価② = 受注金額② / P3件数②
    setV(14, f, v(2,f)  / v(12,f));

    // P4受注率（合計）= 受注社数 / P4件数（当Q） × 100
    setV(16, f, v(8,f)  / v(15,f) * 100, true);
    // P4単価（合計）= (金額①+②) / P4件数（当Q）
    setV(17, f, (v(1,f)+v(2,f)) / v(15,f));

    // P4受注率① = 受注件数① / P4件数① × 100
    setV(19, f, v(6,f)  / v(18,f) * 100, true);
    // P4単価① = 受注金額① / P4件数①
    setV(20, f, v(1,f)  / v(18,f));

    // P4受注率② = 受注件数② / P4件数② × 100
    setV(22, f, v(7,f)  / v(21,f) * 100, true);
    // P4単価② = 受注金額② / P4件数②
    setV(23, f, v(2,f)  / v(21,f));

    // 翌QP3単価 = 翌QP3MRR / 翌QP3件数
    setV(25, f, v(26,f) / v(24,f));
    // 翌QP4単価 = 翌QP4金額 / 翌QP4件数
    setV(28, f, v(30,f) / v(27,f));
  });
}

function extractRevFromPaste(raw) {
  // タブ区切り2Dグリッドとして解析
  const rows = raw.split(/\r?\n/).map(r => r.split('\t').map(c => c.trim()));

  // colLabels[col] = フィールド名（正規化済み）
  const colLabels = {};
  // results[revId] = {tgt, act}
  const results = {};

  // 正規化: カンマ・%・改行除去、スペース除去
  const norm = s => s.replace(/[,，\s\n\r]/g,'').replace(/↪︎/g,'↪').replace(/[（(]/g,'(').replace(/[）)]/g,')');
  const parseNum = s => {
    const n = parseFloat(s.replace(/[,，%]/g,''));
    return isFinite(n) ? n : null;
  };

  for(const row of rows) {
    const hasTgt = row.some(c => c === '目標');
    const hasAct = row.some(c => c === '実績');

    if(!hasTgt && !hasAct) {
      // ラベル行: 各セルの内容でcolLabelsを更新
      row.forEach((cell, i) => {
        const key = norm(cell);
        if(key && key !== '-' && !/^\d/.test(key) && !/^\d+\.?\d*%$/.test(key)) {
          // より具体的（長い）名前が優先
          if(!colLabels[i] || key.length > colLabels[i].length) {
            colLabels[i] = key;
          }
        }
      });
    } else {
      // データ行: 目標/実績マーカーに続く数値を対応するラベルにマップ
      for(let i = 0; i < row.length; i++) {
        const marker = row[i];
        if(marker !== '目標' && marker !== '実績') continue;

        // 次のセルから数値を探す（達成率%は飛ばす）
        let num = null;
        for(let j = i+1; j < Math.min(i+4, row.length); j++) {
          const cell = row[j];
          if(cell === '' || cell === '-') { num = null; break; }
          if(/%$/.test(cell)) continue; // 達成率列はスキップ
          const n = parseNum(cell);
          if(n !== null) { num = n; break; }
        }
        if(num === null) continue;

        // このマーカー列の左で一番近いラベルを探す
        let bestId = null, bestDist = Infinity;
        for(const [col, label] of Object.entries(colLabels)) {
          const dist = i - parseInt(col);
          if(dist < 0 || dist >= 8) continue; // 離れすぎは無視
          const revId = PASTE_FIELD_MAP[label];
          if(revId && dist < bestDist) { bestDist = dist; bestId = revId; }
        }

        if(bestId) {
          if(!results[bestId]) results[bestId] = {tgt: null, act: null};
          const field = marker === '目標' ? 'tgt' : 'act';
          // 同じフィールドへの2度目の代入は無視（後続の重複行対策）
          if(results[bestId][field] === null) results[bestId][field] = num;
        }
      }
    }
  }
  return results;
}

function openPasteRevModal(m) {
  _pasteRevMonth = m;
  _pasteRevParsed = null;
  document.getElementById('pasteRevText').value = '';
  document.getElementById('pasteRevStatus').textContent = '';
  document.getElementById('pasteRevPreview').style.display = 'none';
  document.getElementById('pasteRevPreview').innerHTML = '';
  document.getElementById('pasteRevApplyArea').style.display = 'none';
  document.getElementById('pasteRevModal').style.display = 'flex';
}

function closePasteRevModal() {
  document.getElementById('pasteRevModal').style.display = 'none';
}

function parseAndPreviewPaste() {
  const text = document.getElementById('pasteRevText').value;
  if(!text.trim()) {
    document.getElementById('pasteRevStatus').textContent = 'テキストを貼り付けてください。';
    return;
  }
  const parsed = extractRevFromPaste(text);
  const found = Object.keys(parsed).length;
  if(!found) {
    document.getElementById('pasteRevStatus').textContent = '⚠ 読み取れるフィールドが見つかりませんでした。';
    document.getElementById('pasteRevPreview').style.display = 'none';
    document.getElementById('pasteRevApplyArea').style.display = 'none';
    return;
  }
  _pasteRevParsed = parsed;
  document.getElementById('pasteRevStatus').textContent = found + ' フィールドを検出しました。';

  // プレビュー表示
  const revItems = state[activeGroup][_pasteRevMonth].rev;
  let html = '<table style="width:100%;border-collapse:collapse;font-size:11px">' +
    '<thead><tr style="background:#f1f5f9">' +
    '<th style="padding:5px 8px;text-align:left">項目</th>' +
    '<th style="padding:5px 8px;text-align:right;width:90px">目標</th>' +
    '<th style="padding:5px 8px;text-align:right;width:90px">実績</th>' +
    '</tr></thead><tbody>';
  const sortedIds = Object.keys(parsed).map(Number).sort((a,b)=>a-b);
  sortedIds.forEach(id => {
    const item = revItems.find(r => r.id === id);
    const p = parsed[id];
    const fmt = v => v === null ? '<span style="color:#94a3b8">—</span>' : v.toLocaleString();
    html += '<tr style="border-top:1px solid #f1f5f9">' +
      '<td style="padding:4px 8px;font-weight:600">' + (item ? item.item : 'id:'+id) + '</td>' +
      '<td style="padding:4px 8px;text-align:right;color:#1d4ed8">' + fmt(p.tgt) + '</td>' +
      '<td style="padding:4px 8px;text-align:right;color:#059669">' + fmt(p.act) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  const preview = document.getElementById('pasteRevPreview');
  preview.innerHTML = html;
  preview.style.display = 'block';
  document.getElementById('pasteRevApplyArea').style.display = 'flex';
}

function applyPasteRev() {
  if(!_pasteRevParsed || !_pasteRevMonth) return;
  const rev = state[activeGroup][_pasteRevMonth].rev;
  Object.entries(_pasteRevParsed).forEach(([id, vals]) => {
    const item = rev.find(r => r.id === parseInt(id));
    if(!item) return;
    if(vals.tgt !== null) item.tgt = vals.tgt;
    if(vals.act !== null) item.act = vals.act;
  });
  closePasteRevModal();
  render();
  saveData();
}
